<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Jogo da Memória dos Embaixadores do Rei">

    <title>Jogo da Memória | Embaixadores do Rei</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #102B49;
            color: #F5F3EE;
            min-height: 100vh;
            padding: 25px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #E0C98F;
            font-size: 30px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 15px;
            color: #F5F3EE;
        }

        .painel {
            max-width: 850px;
            margin: auto;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            background: #183D61;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .indicador {
            text-align: center;
        }

        .indicador strong {
            display: block;
            color: #E0C98F;
            font-size: 24px;
        }

        .indicador span {
            font-size: 13px;
        }

        .botao {
            display: block;
            margin: 0 auto 25px;
            padding: 12px 28px;
            background: #C5A15B;
            color: #102B49;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            background: #E0C98F;
        }

        .tabuleiro {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .carta {
            aspect-ratio: 1 / 1;
            perspective: 800px;
            cursor: pointer;
        }

        .carta-interior {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        .carta.virada .carta-interior {
            transform: rotateY(180deg);
        }

        .frente,
        .verso {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
        }

        .frente {
            background: #294F70;
            border: 3px solid #C5A15B;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            color: #E0C98F;
        }

        .verso {
            background: #F5F3EE;
            transform: rotateY(180deg);
            border: 3px solid #C5A15B;
        }

        .verso img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }

        .carta.encontrada {
            opacity: 0.55;
            cursor: default;
        }

        .mensagem {
            display: none;
            text-align: center;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: #183D61;
            border: 2px solid #C5A15B;
            border-radius: 12px;
        }

        .mensagem h2 {
            color: #E0C98F;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {

            .tabuleiro {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            header h1 {
                font-size: 23px;
            }

            .frente {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>JOGO DA MEMÓRIA</h1>

        <p>EMBAIXADORES DO REI</p>

        <p>Encontre todos os pares e vença o desafio!</p>

    </header>


    <section class="painel">

        <div class="indicador">
            <strong id="tentativas">0</strong>
            <span>Tentativas</span>
        </div>

        <div class="indicador">
            <strong id="pares">0 / 20</strong>
            <span>Pares encontrados</span>
        </div>

        <div class="indicador">
            <strong id="tempo">00:00</strong>
            <span>Tempo</span>
        </div>

    </section>


    <button class="botao" onclick="iniciarJogo()">
        NOVA PARTIDA
    </button>


    <main class="tabuleiro" id="tabuleiro">

    </main>


    <section class="mensagem" id="mensagem">

        <h2>PARABÉNS, EMBAIXADOR!</h2>

        <p>Você encontrou todos os pares!</p>

        <p id="resultado"></p>

        <br>

        <button class="botao" onclick="iniciarJogo()">
            JOGAR NOVAMENTE
        </button>

    </section>


    <script>

        "use strict";

        const totalPares = 20;

        let cartasViradas = [];

        let bloqueado = false;

        let tentativas = 0;

        let paresEncontrados = 0;

        let segundos = 0;

        let intervalo = null;

        let iniciado = false;


        // BANCO DE IMAGENS

        const imagens = [];

        for (let i = 1; i <= totalPares; i++) {

            imagens.push({
                id: i,
                arquivo: `imagens/${String(i).padStart(2, "0")}.jpg`
            });

        }


        // EMBARALHAR CARTAS

        function embaralhar(array) {

            for (let i = array.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [array[i], array[j]] = [array[j], array[i]];

            }

            return array;

        }


        // INICIAR PARTIDA

        function iniciarJogo() {

            clearInterval(intervalo);

            cartasViradas = [];

            bloqueado = false;

            tentativas = 0;

            paresEncontrados = 0;

            segundos = 0;

            iniciado = false;

            document.getElementById("mensagem").style.display = "none";

            atualizarPainel();

            document.getElementById("tabuleiro").innerHTML = "";

            const cartas = [];

            imagens.forEach(imagem => {

                cartas.push({ ...imagem });

                cartas.push({ ...imagem });

            });

            embaralhar(cartas);

            cartas.forEach((imagem, indice) => {

                const carta = document.createElement("div");

                carta.className = "carta";

                carta.dataset.id = imagem.id;

                carta.innerHTML = `

                    <div class="carta-interior">

                        <div class="frente">
                            ER
                        </div>

                        <div class="verso">

                            <img
                                src="${imagem.arquivo}"
                                alt="Imagem ${imagem.id}"
                            >

                        </div>

                    </div>

                `;

                carta.addEventListener("click", () => {

                    virarCarta(carta);

                });

                document.getElementById("tabuleiro").appendChild(carta);

            });

        }


        // VIRAR CARTA

        function virarCarta(carta) {

            if (bloqueado) return;

            if (carta.classList.contains("virada")) return;

            if (carta.classList.contains("encontrada")) return;

            if (!iniciado) {

                iniciado = true;

                intervalo = setInterval(() => {

                    segundos++;

                    atualizarPainel();

                }, 1000);

            }

            carta.classList.add("virada");

            cartasViradas.push(carta);

            if (cartasViradas.length === 2) {

                tentativas++;

                atualizarPainel();

                verificarPar();

            }

        }


        // VERIFICAR PAR

        function verificarPar() {

            const [carta1, carta2] = cartasViradas;

            const id1 = carta1.dataset.id;

            const id2 = carta2.dataset.id;

            if (id1 === id2) {

                carta1.classList.add("encontrada");

                carta2.classList.add("encontrada");

                paresEncontrados++;

                cartasViradas = [];

                atualizarPainel();

                if (paresEncontrados === totalPares) {

                    finalizarJogo();

                }

            } else {

                bloqueado = true;

                setTimeout(() => {

                    carta1.classList.remove("virada");

                    carta2.classList.remove("virada");

                    cartasViradas = [];

                    bloqueado = false;

                }, 1000);

            }

        }


        // ATUALIZAR PAINEL

        function atualizarPainel() {

            document.getElementById("tentativas").textContent = tentativas;

            document.getElementById("pares").textContent =
                `${paresEncontrados} / ${totalPares}`;

            const minutos = Math.floor(segundos / 60);

            const resto = segundos % 60;

            document.getElementById("tempo").textContent =

                String(minutos).padStart(2, "0") + ":" +

                String(resto).padStart(2, "0");

        }


        // FINALIZAR JOGO

        function finalizarJogo() {

            clearInterval(intervalo);

            document.getElementById("resultado").textContent =

                `Tentativas: ${tentativas} | Tempo: ${document.getElementById("tempo").textContent}`;

            document.getElementById("mensagem").style.display = "block";

        }


        // PRIMEIRA PARTIDA

        iniciarJogo();

    </script>

</body>

</html>
